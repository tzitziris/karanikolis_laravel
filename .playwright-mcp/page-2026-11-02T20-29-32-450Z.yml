          - generic [ref=f4e357]:
            - paragraph [ref=f4e358]: Τα τμήματά μας
            - heading "Έξι τρόποι προπόνησης." [level=2] [ref=f4e359]
          - paragraph [ref=f4e360]: Από το πρώτο παιχνίδι στο ρινγκ μέχρι τον αγώνα. Κάθε τμήμα έχει τον δικό του ρυθμό, ώστε να βρίσκεις αυτό που σου ταιριάζει.
        - list [ref=f4e361]:
          - listitem [ref=f4e362]:
            - paragraph [ref=f4e363]: "01"
            - heading "Baby Kick Boxing" [level=3] [ref=f4e364]
            - paragraph [ref=f4e365]: Η πρώτη γνωριμία με το άθλημα για παιδιά 4 έως 6 ετών, μέσα από παιχνίδι, κίνηση και συντονισμό.
          - listitem [ref=f4e366]:
            - paragraph [ref=f4e367]: "02"
            - heading "Παιδικά Τμήματα" [level=3] [ref=f4e368]
            - paragraph [ref=f4e369]: Kick boxing και πυγμαχία για παιδιά 6 έως 14 ετών, σε ομάδες ανά ηλικία.
          - listitem [ref=f4e370]:
            - paragraph [ref=f4e371]: "03"
            - heading "Ενηλίκων" [level=3] [ref=f4e372]
            - paragraph [ref=f4e373]: "Kick boxing και πυγμαχία για ενήλικες: τεχνική, φυσική κατάσταση και πειθαρχία."
          - listitem [ref=f4e374]:
            - paragraph [ref=f4e375]: "04"
            - heading "Αγωνιστικό" [level=3] [ref=f4e376]
            - paragraph [ref=f4e377]: Προετοιμασία για παιδιά και ενήλικες με αγωνιστικούς στόχους.
          - listitem [ref=f4e378]:
            - paragraph [ref=f4e379]: "05"
            - heading "Cross Training Γυναικείο" [level=3] [ref=f4e380]
            - paragraph [ref=f4e381]: Γυναικείο τμήμα για δύναμη, αντοχή και φυσική κατάσταση.
          - listitem [ref=f4e382]:
            - paragraph [ref=f4e383]: "06"
            - heading "Personal Training" [level=3] [ref=f4e384]
            - paragraph [ref=f4e385]: Ατομική προπόνηση με τον προπονητή, σε ημέρα και ώρα που κανονίζουμε μαζί.
