              - generic [ref=f6e48]: "& τεχνική"
            - paragraph [ref=f6e49]: Η προπόνηση βασίζεται στον σεβασμό, την καθαρή τεχνική και τη συνεχή προσπάθεια. Κάθε μάθημα έχει στόχο να χτίσει δυνατό σώμα, γρήγορη σκέψη και αυτοπεποίθηση, χωρίς υπερβολές και χωρίς βιασύνη. Η ομάδα προχωράει μαζί, με σοβαρότητα και αγωνιστικό πνεύμα.
