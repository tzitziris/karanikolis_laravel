              - generic [ref=f6e43]: "2010"
            - paragraph [ref=f6e44]: Οι Μαχητές Ελευθερούπολης δημιουργήθηκαν για να προσφέρουν έναν σοβαρό και οργανωμένο χώρο προπόνησης kickboxing στην περιοχή. Με σταθερή παρουσία στην τοπική κοινότητα, η σχολή στηρίζει νέους και ενήλικες που θέλουν να γυμναστούν, να μάθουν τεχνική και να εξελιχθούν με πειθαρχία.
          - article [ref=f6e45]:
